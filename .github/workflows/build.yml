name: Build PLUA

on:
  push:
    tags:
      - 'v*'

env:
  BUILD_TYPE: Release

jobs:

  # ─────────────────────────────────────────
  #  macOS (Apple Silicon)
  # ─────────────────────────────────────────
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache CMake deps (SDL3, ImGui)
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: macos-deps-${{ hashFiles('cmake/Dependencies.cmake') }}
          restore-keys: macos-deps-

      - name: Cache llama.cpp build
        uses: actions/cache@v4
        with:
          path: build/third_party/llama.cpp
          key: macos-llama-${{ hashFiles('third_party/llama.cpp/CMakeLists.txt') }}
          restore-keys: macos-llama-

      - name: Install tools
        run: brew install create-dmg

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel 1

      - name: Bundle dylibs into app
        run: |
          APP_PATH=$(find build -name "PLUA.app" -type d | head -1)
          MACOS_DIR="$APP_PATH/Contents/MacOS"
          BINARY="$MACOS_DIR/PLUA"

          find build/bin -name "*.dylib" | while read LIB; do
            echo "Copying: $(basename $LIB)"
            cp -f "$LIB" "$MACOS_DIR/"
          done

          find build/_deps -name "libSDL3*.dylib" | while read LIB; do
            echo "Copying SDL3: $(basename $LIB)"
            cp -f "$LIB" "$MACOS_DIR/"
          done

      - name: Create DMG
        run: |
          mkdir -p dist
          APP_PATH=$(find build -name "PLUA.app" -type d | head -1)
          echo "App found at: $APP_PATH"

          hdiutil create -volname "PLUA" \
            -srcfolder "$APP_PATH" \
            -ov -format UDZO \
            "dist/PLUA-${{ github.ref_name }}-macOS.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PLUA-macOS
          path: dist/PLUA-*.dmg

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PLUA-*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────
  #  Windows (x64, MSVC)
  # ─────────────────────────────────────────
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache CMake deps (SDL3, ImGui)
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: windows-deps-${{ hashFiles('cmake/Dependencies.cmake') }}
          restore-keys: windows-deps-

      - name: Cache llama.cpp build
        uses: actions/cache@v4
        with:
          path: build/third_party/llama.cpp
          key: windows-llama-${{ hashFiles('third_party/llama.cpp/CMakeLists.txt') }}
          restore-keys: windows-llama-

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Configure CMake
        run: |
          cmake -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel 1

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          
          $exe = Get-ChildItem -Path "build" -Filter "PLUA.exe" -Recurse | Select-Object -First 1
          if ($exe) {
            Copy-Item $exe.FullName "dist\"
            Write-Host "exe: $($exe.FullName)"
          } else { Write-Error "PLUA.exe not found!" }
          
          Get-ChildItem -Path "build\bin" -Filter "*.dll" -Recurse | ForEach-Object {
            Copy-Item $_.FullName "dist\"
            Write-Host "Copied DLL: $($_.Name)"
          }
          Get-ChildItem -Path "build\_deps" -Filter "libSDL3*.dll" -Recurse | ForEach-Object {
            Copy-Item $_.FullName "dist\"
            Write-Host "Copied SDL3 DLL: $($_.Name)"
          }
          
          if (Test-Path "fonts")  { Copy-Item "fonts"  "dist\" -Recurse -Force }
          if (Test-Path "config") { Copy-Item "config" "dist\" -Recurse -Force }
          
          New-Item -ItemType Directory -Force -Path "dist\models"
          
          Write-Host "--- dist ---"
          Get-ChildItem "dist" -Recurse

      - name: Install NSIS
        run: choco install nsis -y

      - name: Create installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $nsis = @"
          Unicode true
          !define APP_NAME "PLUA"
          !define APP_VERSION "$version"

          Name "`${APP_NAME} `${APP_VERSION}"
          OutFile "PLUA-$version-Windows-Setup.exe"
          InstallDir "`$PROGRAMFILES64\PLUA"
          RequestExecutionLevel admin
          SetCompressor /SOLID lzma

          !include "MUI2.nsh"
          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          !insertmacro MUI_UNPAGE_CONFIRM
          !insertmacro MUI_UNPAGE_INSTFILES
          !insertmacro MUI_LANGUAGE "English"

          Section "Install"
            SetOutPath "`$INSTDIR"
            File /r "dist\*.*"
            CreateShortcut "`$DESKTOP\PLUA.lnk" "`$INSTDIR\PLUA.exe"
            CreateDirectory "`$SMPROGRAMS\PLUA"
            CreateShortcut "`$SMPROGRAMS\PLUA\PLUA.lnk" "`$INSTDIR\PLUA.exe"
            WriteUninstaller "`$INSTDIR\Uninstall.exe"
          SectionEnd

          Section "Uninstall"
            Delete "`$INSTDIR\*.*"
            RMDir /r "`$INSTDIR"
            Delete "`$DESKTOP\PLUA.lnk"
            RMDir /r "`$SMPROGRAMS\PLUA"
          SectionEnd
          "@
          $nsis | Out-File -Encoding ASCII installer.nsi
          & "C:\Program Files (x86)\NSIS\makensis.exe" installer.nsi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PLUA-Windows
          path: PLUA-*-Windows-Setup.exe

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: PLUA-*-Windows-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}